olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  patentproof: 1

metadata:
  name: patentproof
  title: Patent Proofreader
  description: Proofread Japanese patent specifications (.docx) with rules and a local LLM, saving results as tracked changes and comments
  icon: https://raw.githubusercontent.com/ryosk7/olares-patentproof/main/icon.png
  version: 1.0.5
  categories:
  - Utilities_v112

entrances:
- name: patentproof
  port: 8080
  title: Patent Proofreader
  host: patentproof
  icon: https://raw.githubusercontent.com/ryosk7/olares-patentproof/main/icon.png
  authLevel: private
  openMethod: default

permission:
  appData: true
  userData:
  - Home/Documents/

envs:
- envName: PROOF_LLM_BASE_URL
  type: url
  required: false
  editable: true
  applyOnChange: true
  default: "http://3a77b15d.shared.olares.com/v1"
  description: "OpenAI-compatible API URL of the LLM (e.g. the Olares Router shared entrance). Can also be changed on the app's Settings page."
- envName: PROOF_LLM_MODEL
  type: string
  required: false
  editable: true
  applyOnChange: true
  default: "Olares/unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL"
  description: "Model name to use. Can also be picked from a list on the app's Settings page."
- envName: PROOF_OCR_URL
  type: string
  required: false
  editable: true
  applyOnChange: true
  default: "http://43279715.shared.olares.com"
  description: "Shared entrance URL of PaddleOCR for drawing checks. Leave empty to skip drawing checks."

spec:
  versionName: '1.0.5'
  fullDescription: |
    Proofreads Japanese patent specifications (.docx) in Home/Documents. A local LLM checks each category
    (typos and mis-conversions, inconsistent terms, notation variants, colloquial wording, reference-numeral mismatches)
    with 3-run majority voting, alongside rule-based checks and optional OCR matching against drawing PDFs.
    Results are saved next to the original as a .docx with tracked changes and comments, plus a CSV list.
    Requires an LLM reachable through Olares Router (e.g. Qwen3.8-27B); PaddleOCR is optional for drawing checks.
    On first launch, open "Settings" in the app to choose the LLM and model.
  developer: ryosk7
  submitter: ryosk7
  locale:
  - ja-JP
  - en-US
  supportArch:
  - amd64
  - arm64
  accelerator:
  - mode: cpu
    requiredCpu: 100m
    limitedCpu: 1000m
    requiredMemory: 128Mi
    limitedMemory: 1Gi
    requiredDisk: 50Mi
    limitedDisk: 1Gi

options:
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
